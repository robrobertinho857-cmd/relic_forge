class="svelte-1t1nyui">Adjust weather, time and launch in Customize.</li> <li class="svelte-1t1nyui">Press <strong class="svelte-1t1nyui">FLY</strong> and watch the flight.</li> <li class="svelte-1t1nyui">See your result, then choose Fly Again or Change Settings.</li></ol> <p class="svelte-1t1nyui">Collect feathers and crystals, ride air currents and pass natural obstacles. A flight ends
					in a landing or a crash.</p></section> <section aria-labelledby="help-creatures" class="svelte-1t1nyui"><h3 id="help-creatures" class="svelte-1t1nyui">CREATURES</h3> <div class="guide-grid creature-grid svelte-1t1nyui"></div> <p class="note svelte-1t1nyui">Creature choice changes appearance and movement, with the same chances and payouts.</p></section> <section aria-labelledby="help-bet" class="svelte-1t1nyui"><h3 id="help-bet" class="svelte-1t1nyui">BET &amp; RISK</h3> <p class="svelte-1t1nyui">Choose your base bet from the available amounts. Connected play uses the wallet’s
					permitted bet levels.</p> <div class="guide-grid three-grid svelte-1t1nyui"><article class="guide-card svelte-1t1nyui"><strong class="svelte-1t1nyui">SAFE</strong><span class="svelte-1t1nyui">Shorter flights, fewer crashes and smaller potential rewards.</span></article> <article class="guide-card svelte-1t1nyui"><strong class="svelte-1t1nyui">BALANCED</strong><span class="svelte-1t1nyui">Medium risk and reward potential.</span></article> <article class="guide-card svelte-1t1nyui"><strong class="svelte-1t1nyui">DANGER</strong><span class="svelte-1t1nyui">More crashes, with longer flights and larger rewards possible.</span></article></div> <div class="formula svelte-1t1nyui">Final win = bet × final multiplier</div> <p class="note svelte-1t1nyui">A crash ends at x0, including when you collected items earlier. Setup stays locked until
					you choose Change Settings.</p></section> <section aria-labelledby="help-landscapes" class="svelte-1t1nyui"><h3 id="help-landscapes" class="svelte-1t1nyui">LANDSCAPES</h3> <p class="svelte-1t1nyui"> </p> <p class="note svelte-1t1nyui">The landscapes you reach depend on how the flight unfolds.</p></section> <section aria-labelledby="help-customize" class="svelte-1t1nyui"><h3 id="help-customize" class="svelte-1t1nyui">CUSTOMIZE</h3> <p class="svelte-1t1nyui">Choose time of day, weather and launch animation in any order. Choices apply immediately
					and do not change odds or payouts. Reset defaults restores Day, Clear and Glide.</p> <div class="guide-grid three-grid svelte-1t1nyui"><!> <!> <!></div></section> <section aria-labelledby="help-events" class="svelte-1t1nyui"><h3 id="help-events" class="svelte-1t1nyui">ALONG THE WAY</h3> <div class="event-groups svelte-1t1nyui"><div class="svelte-1t1nyui"><strong class="svelte-1t1nyui">OBSTACLES</strong><span class="svelte-1t1nyui"> </span></div> <div class="svelte-1t1nyui"><strong class="svelte-1t1nyui">PICKUPS</strong><span class="svelte-1t1nyui"> </span></div> <div class="svelte-1t1nyui"><strong class="svelte-1t1nyui">AIR CURRENTS</strong><span class="svelte-1t1nyui"> </span></div> <div class="svelte-1t1nyui"><strong class="svelte-1t1nyui">PREDATOR ENCOUNTERS</strong><span class="svelte-1t1nyui"> </span></div></div> <p class="svelte-1t1nyui">Pickups, currents and successful encounters can increase the displayed multiplier. The
					final result determines your win.</p></section> <section aria-labelledby="help-endings" class="svelte-1t1nyui"><h3 id="help-endings" class="svelte-1t1nyui">FLIGHT ENDINGS</h3> <p class="svelte-1t1nyui"> </p> <p class="svelte-1t1nyui">Successful flights finish at outdoor landing spots, from an open meadow to a secluded
					valley or high summit.</p></section> <section aria-labelledby="help-info" class="svelte-1t1nyui"><h3 class="svelte-1t1nyui">BONUS FLIGHTS &amp; REPLAYS</h3> <p class="svelte-1t1nyui">Bonus Flights offers two direct-entry routes: Storm Run costs 20× your base bet and Summit
					Expedition costs 50×. Open Payouts &amp; chances in the route menu to see every possible
					result. A purchased flight can return zero; entry does not guarantee a payout. Risk
					settings apply to normal flights only.</p> <p class="svelte-1t1nyui">Bonus multipliers use the base bet. Results show the full entry cost, payout and net
					result. History keeps 20 completed flights for this session. Its Replay button shows a
