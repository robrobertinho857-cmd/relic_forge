name: Relic Forge frontend

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.5.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter relic-forge lint
      - run: pnpm --filter relic-forge exec svelte-check --tsconfig ./tsconfig.json
      - run: pnpm --filter relic-forge build
