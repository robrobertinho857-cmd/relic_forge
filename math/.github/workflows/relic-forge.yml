name: Relic Forge math

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest games/relic_forge/test_relic_wild.py -q
      - run: python games/relic_forge/simulate.py --sims 1000
